<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada · Urbiverso</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Servida pelo Pages para qualquer caminho que não existe: por isso os endereços são absolutos (a partir da raiz do domínio). */
:root{color-scheme:dark;--espaco:#03030A;--texto:#EEEDF2;--apagado:#8A89A0;--laranja:#F7A111;--sans:"Archivo",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html{background:var(--espaco)}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:40px 20px;color:var(--texto);font-family:var(--sans);text-align:center;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 45% at 75% 20%,rgba(26,26,85,.55),transparent 70%),radial-gradient(50% 40% at 15% 85%,rgba(154,43,121,.12),transparent 70%),var(--espaco)}
main{display:grid;justify-items:center;gap:18px}
img{width:72px;height:72px}
.codigo{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--laranja)}
h1{margin:0;font-weight:700;font-stretch:80%;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.01em}
a{display:inline-block;margin-top:8px;font:600 15px var(--sans);color:var(--espaco);background:var(--texto);border-radius:8px;padding:13px 22px;text-decoration:none}
a:hover{background:#fff}
a:focus-visible{outline:2px solid var(--laranja);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/simbolo.webp" alt="">
  <span class="codigo">404</span>
  <h1>Página não encontrada</h1>
  <a href="/">Ir para o início</a>
</main>
</body>
</html>
